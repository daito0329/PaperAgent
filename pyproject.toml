[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-agent"
version = "0.1.0"
description = "Local LLM agent for reading and comparing research papers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "google-adk>=2.3",
  "httpx>=0.27",
  "litellm>=1.70,<1.80",
  "pydantic>=2.6",
  "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
